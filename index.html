<script>
(()=>{
const $=id=>document.getElementById(id),API='https://api.groq.com/openai/v1/chat/completions';
const K={key:'wing_groq_key',lang:'wing_language',mood:'wing_v5_mood',hist:'wing_v5_history',profiles:'wing_v5_profiles'};
const LANG={fr:'French (français)',en:'English',ht:'Haitian Creole (Kreyòl ayisyen)',es:'Spanish (español)',pt:'Portuguese (português)'};
const MOOD={playful:'taquin, spontané, légèrement provocateur',smooth:'naturel, fluide, subtil',confident:'confiant, direct, sans arrogance',funny:'drôle, vif, pas clownesque',soft:'chaleureux, attentionné, sincère'};
const SCAN_SYSTEM=`You are a careful screenshot transcription and conversation-structure engine. Do NOT write replies. Read only what is visibly present in the supplied chat screenshots. Preserve the original language, spelling, emojis, punctuation and message order. Separate each visible message into a chronological transcript and identify speaker as ME, THEM or UNKNOWN only when the screenshot makes it reasonably clear. Identify the latest visible message and its speaker. Never invent cropped, hidden, blurred or unreadable text. If a fragment is uncertain, write [UNCLEAR] and list it in uncertain_parts. Do not infer romantic interest or psychology from a screenshot. If multiple screenshots overlap, avoid duplicating repeated messages and preserve chronological order. Return ONLY valid JSON with this shape: {"screen_type":"chat|profile|other","transcript":"ME: ...\\nTHEM: ...","latest_message":"exact latest visible message or empty string","latest_speaker":"ME|THEM|UNKNOWN","uncertain_parts":["..."],"scan_note":"short note about readability or missing context"}.`;
const REPLY_SYSTEM=`You are WING, a concise, socially intelligent texting wingman. Generate natural, human-sounding messages that could plausibly be sent by the user. Avoid generic pickup lines, clichés, over-polished wording, fake confidence, manipulative tactics, pressure, guilt, or sexual escalation without clear mutual context. Respect rejection and boundaries. Use specific details from the supplied transcript. Do not invent facts, feelings, intentions, or shared experiences. If the latest message is from ME, do not pretend THEM sent it; suggest the next appropriate move or ask for the missing reply context. If the transcript is ambiguous, be cautious. Output in the requested language only. Every suggested message must be SHORT: ideally 4–12 words, never more than 14 words, usually one sentence, no explanation inside the message. Each option must be genuinely different, not five rewrites of the same line. Return ONLY valid JSON: {"read":"one short sentence describing the actual conversational situation","tone":"one or two words","next_move":"one short sentence of advice","replies":[{"style":"Natural","text":"..."},{"style":"Playful","text":"..."},{"style":"Flirty","text":"..."},{"style":"Confident","text":"..."},{"style":"Warm","text":"..."}]}.`;
let mood=localStorage.getItem(K.mood)||'playful',files=[],profiles=load(K.profiles,[]),saved=load(K.hist,[]),currentProfile='',lastReq=null,recognition=null;
function load(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d}catch{return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){status('Le stockage du navigateur est plein.',true);return false}}
function status(t,err=false){$('status').textContent=t;$('status').className='status'+(err?' error':'')}
function apiKey(){return $('apiKey').value.trim()||localStorage.getItem(K.key)||''}
function connection(){ $('connection').textContent=apiKey()?'● CLÉ CONFIGURÉE':'● CLÉ MANQUANTE'}
$('apiKey').value=localStorage.getItem(K.key)||'';connection();
$('language').value=localStorage.getItem(K.lang)||'fr';if(!LANG[$('language').value])$('language').value='fr';document.documentElement.lang=$('language').value;
$('language').onchange=()=>{localStorage.setItem(K.lang,$('language').value);document.documentElement.lang=$('language').value;status('Langue de réponse : '+LANG[$('language').value])};
$('saveKey').onclick=()=>{let v=$('apiKey').value.trim();if(!v)return status('Colle ta clé API Groq.',true);localStorage.setItem(K.key,v);connection();status('Clé enregistrée sur cet appareil.')};
$('showKey').onclick=()=>{$('apiKey').type=$('apiKey').type==='password'?'text':'password';$('showKey').textContent=$('apiKey').type==='password'?'Voir':'Masquer'};
$('apiKey').oninput=connection;$('forgetKey').onclick=()=>{localStorage.removeItem(K.key);$('apiKey').value='';connection();status('Clé retirée du navigateur.')};
$('moods').onclick=e=>{let b=e.target.closest('[data-mood]');if(!b)return;mood=b.dataset.mood;localStorage.setItem(K.mood,mood);document.querySelectorAll('.mood').forEach(x=>x.classList.toggle('active',x===b))};
document.querySelectorAll('.mood').forEach(x=>x.classList.toggle('active',x.dataset.mood===mood));
function renderProfiles(){let s=$('person'),v=currentProfile;s.innerHTML='<option value="">Conversation générale</option>';profiles.forEach(p=>{let o=document.createElement('option');o.value=p.id;o.textContent=p.name;s.append(o)});s.value=v;let l=$('profileList');l.innerHTML='';if(!profiles.length){l.innerHTML='<div class="empty">Aucun profil.</div>';return}profiles.forEach(p=>{let b=document.createElement('button');b.className='btn small';b.textContent=p.name;b.onclick=()=>{currentProfile=p.id;s.value=p.id;status('Profil sélectionné : '+p.name)};l.append(b)})}
$('person').onchange=()=>currentProfile=$('person').value;
$('newPerson').onclick=()=>{$('profileEditor').style.display='block';$('personName').value='';$('personNotes').value='';$('personName').focus()};
$('cancelPerson').onclick=()=>$('profileEditor').style.display='none';
$('savePerson').onclick=()=>{let name=$('personName').value.trim();if(!name)return status('Donne un nom au profil.',true);currentProfile=crypto.randomUUID?crypto.randomUUID():String(Date.now());profiles.push({id:currentProfile,name,notes:$('personNotes').value.trim()});save(K.profiles,profiles);renderProfiles();$('profileEditor').style.display='none';status('Profil créé.')};
function renderHistory(){let root=$('historyList');root.innerHTML='';if(!saved.length){root.innerHTML='<div class="empty">Aucune analyse.</div>';return}saved.forEach(x=>{let row=document.createElement('div');row.className='history-item';let b=document.createElement('button');b.className='btn small history-open';let t=document.createElement('strong');t.textContent=x.title||'Analyse';let d=document.createElement('small');d.textContent=new Date(x.date).toLocaleString();b.append(t,d);b.onclick=()=>restore(x.id);let del=document.createElement('button');del.className='btn small';del.textContent='×';del.onclick=()=>{saved=saved.filter(y=>y.id!==x.id);save(K.hist,saved);renderHistory()};row.append(b,del);root.append(row)})}
function restore(id){let x=saved.find(y=>y.id===id);if(!x)return;currentProfile=x.profileId||'';$('person').value=currentProfile;$('transcript').value=x.transcript||'';$('scanPanel').style.display=x.transcript?'block':'none';$('message').value=x.message||'';$('analysis').style.display=x.read?'block':'none';$('analysis').textContent=x.read?'Lecture : '+x.read+' · Ton : '+(x.tone||''):'';
renderReplies(x.replies||[]);status('Analyse restaurée. Les images originales ne sont pas conservées.');window.scrollTo({top:0,behavior:'smooth'})}
function addImagePreview(){let root=$('preview');root.innerHTML='';files.forEach(f=>{let im=document.createElement('img');im.alt='Aperçu capture';im.src=URL.createObjectURL(f);root.append(im)})}
$('images').onchange=e=>{files=[...e.target.files].slice(0,3);if(e.target.files.length>3)status('Maximum 3 captures. Les premières ont été gardées.',true);for(let f of files)if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>8*1024*1024){status('Chaque capture doit être PNG/JPG/WEBP et faire moins de 8 Mo.',true);files=[];break}addImagePreview();$('scanPanel').style.display='none'};
function readFile(f){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}
async function callGroq(messages,{json=true,max=900,temperature=.2}={}){let body={model:$('model').value,messages,temperature,max_completion_tokens:max,top_p:1};if(json)body.response_format={type:'json_object'};let res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey()},body:JSON.stringify(body)});let data=await res.json();if(!res.ok)throw Error(data?.error?.message||'Erreur Groq HTTP '+res.status);let txt=data.choices?.[0]?.message?.content;if(!txt)throw Error('Réponse vide du modèle.');if(!json)return txt;try{return JSON.parse(txt)}catch(e){let m=txt.match(/\{[\s\S]*\}/);if(m)return JSON.parse(m[0]);throw Error('Le modèle a renvoyé un format illisible. Réessaie.')} }
$('scan').onclick=async()=>{if(!apiKey())return status('Ajoute ta clé API Groq.',true);if(!files.length)return status('Ajoute au moins une capture à scanner.',true);let b=$('scan');b.disabled=true;b.textContent='Scan en cours…';status('Lecture des bulles, des locuteurs et de l’ordre des messages…');$('scanPanel').style.display='none';
try{let content=[{type:'text',text:'Transcribe these chat screenshots. Preserve exact visible text and order. Screenshots are supplied in chronological order if possible. Mark uncertainty; never guess.'}];for(let f of files)content.push({type:'image_url',image_url:{url:await readFile(f)}});let result=await callGroq([{role:'system',content:SCAN_SYSTEM},{role:'user',content}],{json:true,max:1400,temperature:0});if(!result.transcript)throw Error('Aucun texte de conversation lisible détecté. Essaie une capture plus nette.');$('transcript').value=result.transcript;$('scanMeta').textContent='Dernier message détecté ('+(result.latest_speaker||'locuteur incertain')+') : '+(result.latest_message||'non identifié')+'. '+(result.uncertain_parts?.length?'À vérifier : '+result.uncertain_parts.join(' · '):'Aucun passage signalé comme incertain.')+' '+(result.scan_note||'');$('scanPanel').style.display='block';$('message').value='';status('Scan terminé. Corrige le texte extrait avant de générer les réponses.');$('scanPanel').scrollIntoView({behavior:'smooth',block:'nearest'});}
catch(e){status('Scan impossible : '+e.message,true)}finally{b.disabled=false;b.textContent='⌕ Scanner la conversation'}};
function wordCount(s){return (s.trim().match(/\S+/g)||[]).length}
function renderReplies(replies){let root=$('suggestions');root.innerHTML='';let labels=['Natural','Playful','Flirty','Confident','Warm'];let count=0;(replies||[]).slice(0,5).forEach((r,i)=>{let text=(r.text||'').trim();if(!text)return;let card=document.createElement('div');card.className='suggestion';let m=document.createElement('div');m.className='meta';m.textContent=(r.style||labels[i]||'OPTION').toUpperCase()+' · '+wordCount(text)+' MOTS';let p=document.createElement('p');p.textContent=text;let c=document.createElement('button');c.className='btn small';c.textContent='Copier';c.onclick=async()=>{try{await navigator.clipboard.writeText(text);status('Réponse copiée.')}catch{status('Copie indisponible dans ce navigateur.',true)}};card.append(m,p,c);root.append(card);count++});if(!count)status('Aucune réponse lisible reçue. Réessaie.',true)}
async function generate(useTranscript){if(!apiKey())return status('Ajoute ta clé API Groq.',true);let transcript=useTranscript?$('transcript').value.trim():$('message').value.trim();if(!transcript)return status('Colle un message ou scanne une capture.',true);let profile=profiles.find(p=>p.id===currentProfile),extra=$('extraContext').value.trim();let req={transcript,message:$('message').value.trim(),extra,profileId:currentProfile,goal:$('goal').value,mood,lang:$('language').value};lastReq=req;let b=$('quickGenerate');b.disabled=true;$('generate').disabled=true;$('regenerate').disabled=true;status('WING prépare cinq réponses courtes…');
try{let past=saved.filter(x=>x.profileId===currentProfile).slice(0,2).map(x=>'Previous context: '+(x.transcript||x.message||'')).join('\n');let prompt=`OUTPUT LANGUAGE: ${LANG[req.lang]}. User style: ${MOOD[req.mood]}. Goal: ${req.goal}. CONVERSATION TRANSCRIPT (user-corrected if screenshot scanned):\n${transcript}\nUSER CONTEXT: ${extra||'None supplied.'}\nPROFILE NOTES: ${profile?profile.name+'. '+profile.notes:'None.'}\nRECENT CONTEXT: ${past||'None.'}\nGenerate five distinct ready-to-send options. Each must be 4–12 words when possible and never exceed 14 words. One sentence max. Refer to a real detail in the transcript. No long explanation. If the screenshot scan has ambiguous speakers, mention uncertainty briefly in the read field.`;
let result=await callGroq([{role:'system',content:REPLY_SYSTEM},{role:'user',content:prompt}],{json:true,max:750,temperature:.75});let replies=(result.replies||[]).slice(0,5).map(x=>({style:x.style||'Option',text:(x.text||'').trim()})).filter(x=>x.text);if(!replies.length)throw Error('Aucune suggestion générée. Réessaie.');replies=replies.map(x=>{if(wordCount(x.text)>14){let words=x.text.split(/\s+/);x.text=words.slice(0,14).join(' ').replace(/[,:;]$/,'')}return x});$('analysis').style.display='block';$('analysis').innerHTML='';let a=document.createElement('div');a.className='mini';a.textContent='LECTURE : '+(result.read||'')+' · TON : '+(result.tone||'')+' · PROCHAINE ÉTAPE : '+(result.next_move||'');$('analysis').append(a);renderReplies(replies);
let item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date:new Date().toISOString(),profileId:currentProfile,title:(transcript||'Conversation').slice(0,65),transcript,message:req.message,read:result.read,tone:result.tone,replies};saved.unshift(item);saved=saved.slice(0,80);save(K.hist,saved);renderHistory();$('regenerate').disabled=false;status('Terminé. Les propositions sont courtes : choisis celle qui te ressemble.');}
catch(e){status('Génération impossible : '+e.message,true)}finally{b.disabled=false;$('generate').disabled=false}}
$('generate').onclick=()=>generate(true);$('quickGenerate').onclick=()=>generate(false);$('regenerate').onclick=()=>{if(!lastReq)return;generate(!!lastReq.transcript&&$('scanPanel').style.display!=='none')};
$('clear').onclick=()=>{files=[];$('images').value='';$('preview').innerHTML='';$('message').value='';$('transcript').value='';$('extraContext').value='';$('scanPanel').style.display='none';$('analysis').style.display='none';$('suggestions').innerHTML='';lastReq=null;$('regenerate').disabled=true;status('Champs effacés. L’historique sauvegardé reste disponible.')};
$('deleteHistory').onclick=()=>{if(confirm('Effacer tout l’historique ?')){saved=[];save(K.hist,saved);renderHistory();status('Historique supprimé.')}};
$('deleteAll').onclick=()=>{if(!confirm('Effacer la clé, les profils et l’historique sur cet appareil ?'))return;[K.key,K.hist,K.profiles].forEach(x=>localStorage.removeItem(x));saved=[];profiles=[];currentProfile='';$('apiKey').value='';renderHistory();renderProfiles();connection();status('Données locales supprimées.')};
$('voice').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voiceStatus').textContent='Dictée non disponible dans ce navigateur.';return}if(recognition){recognition.stop();recognition=null;return}recognition=new SR();recognition.lang=({fr:'fr-FR',en:'en-US',ht:'fr-FR',es:'es-ES',pt:'pt-BR'})[$('language').value];recognition.interimResults=true;recognition.continuous=false;recognition.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;$('message').value+=($('message').value?' ':'')+t};recognition.onerror=()=>{$('voiceStatus').textContent='Micro non autorisé ou dictée indisponible.'};recognition.onend=()=>{$('voiceStatus').textContent='Dictée terminée.';recognition=null};recognition.start();$('voiceStatus').textContent='Écoute…'};
$('message').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')generate(false)});
renderHistory();renderProfiles();
})();
</script>
</body>
</html>
